<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | BDU Library</title>
    <style>
        body { display: flex; margin: 0; background: #f4f7f6; font-family: sans-serif; transition: 0.3s; }
        .sidebar { width: 260px; background: #14213d; height: 100vh; color: white; padding: 30px 20px; position: fixed; transition: 0.3s; z-index: 1000; }
        .sidebar h2 { color: #fca311; margin-bottom: 40px; }
        .menu-item { padding: 15px; cursor: pointer; color: #adb5bd; transition: 0.3s; }
        .menu-item:hover { color: white; background: rgba(255,255,255,0.1); border-radius: 5px; }
        .main { margin-left: 260px; padding: 40px; width: 100%; min-height: 100vh; transition: 0.3s; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        #mode-btn { padding: 10px 20px; cursor: pointer; border-radius: 20px; border: none; background: #fca311; font-weight: bold; transition: 0.3s; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .resource-card { background: white; padding: 25px; border-radius: 10px; border-left: 5px solid #fca311; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; margin-bottom: 10px; }
        .resource-card h3 { margin-top: 0; color: #14213d; }
        .btn-sm { display: inline-block; margin-top: 15px; padding: 8px 15px; background: #e5e5e5; text-decoration: none; color: #333; font-size: 0.8rem; border-radius: 5px; }
        .btn-sm:hover { background: #fca311; color: white; }
        body.dark-mode { background-color: #1a1a1a; color: #ffffff; }
        .dark-mode .sidebar { background-color: #000000; }
        .dark-mode .resource-card { background-color: #2d2d2d; color: white; }
        @media (max-width: 900px) { .sidebar { width: 70px; padding: 20px 10px; } .sidebar h2, .menu-item span { display: none; } .main { margin-left: 70px; } }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>BDU BiT</h2>
        <div class="menu-item">🏠 <span>Dashboard</span></div>
        <div class="menu-item">💻 <span>Computing</span></div>
        <div class="menu-item">🏗️ <span>Engineering</span></div>
        <br>
        <a href="index.html" style="color: #fca311; text-decoration: none; padding: 10px;">Logout</a>
    </div>

    <div class="main">
        <header>
            <h1>BiT Digital Library</h1>
            <button onclick="toggleDarkMode()" id="mode-btn">🌙 Dark Mode</button>
        </header>

        <h2 style="margin-bottom: 20px;">📚 All Available Resources</h2>
        <div class="grid" id="all-books-grid">
            <p>Loading resources from database...</p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAffCW8wwCs8f2YmpNfHFdOukrEc_CwVRU",
            authDomain: "bit-library-5b48a.firebaseapp.com",
            projectId: "bit-library-5b48a",
            storageBucket: "bit-library-5b48a.firebasestorage.app",
            messagingSenderId: "945815538835",
            appId: "1:945815538835:web:2dd95cd993dc6c2865d166"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadBooks() {
            try {
                const querySnapshot = await getDocs(collection(db, "books"));
                const mainGrid = document.getElementById("all-books-grid");
                
                mainGrid.innerHTML = ""; // መጀመሪያ ባዶ ማድረግ

                if (querySnapshot.empty) {
                    mainGrid.innerHTML = "<p>ዳታቤዙ ውስጥ ምንም መጽሐፍ አልተገኘም (Database is empty).</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const book = doc.data();
                    console.log("Found book:", book); // ለሙከራ ኮንሶል ላይ ማየት

                    const bookHTML = `
                        <div class="resource-card">
                            <h3>${book.title || 'Untitled'}</h3>
                            <p>Category: ${book.category || 'General'}</p>
                            <p>${book.description || 'No description available'}</p>
                            <a href="${book.link || '#'}" class="btn-sm" target="_blank">View / Download</a>
                        </div>
                    `;
                    mainGrid.innerHTML += bookHTML;
                });

            } catch (error) {
                console.error("Firebase Error:", error);
                document.getElementById("all-books-grid").innerHTML = `
                    <p style="color:red;">Error: ዳታውን ማምጣት አልተቻለም።<br>
                    ምክንያት፦ ${error.message}</p>`;
            }
        }

        loadBooks();
    </script>

    <script>
        function toggleDarkMode() {
            var element = document.body;
            element.classList.toggle("dark-mode");
            var btn = document.getElementById("mode-btn");
            btn.innerHTML = element.classList.contains("dark-mode") ? "☀️ Light Mode" : "🌙 Dark Mode";
        }
    </script>
</body>
</html>
