<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | BDU Library</title>
    <style>
        body { display: flex; margin: 0; background: #f8f9fa; font-family: sans-serif; }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #14213d;
            height: 100vh;
            color: white;
            padding: 30px 20px;
            position: fixed;
        }
        
        .sidebar h2 { color: #fca311; margin-bottom: 40px; }
        .menu-item { padding: 15px; cursor: pointer; color: #adb5bd; transition: 0.3s; }
        .menu-item:hover { color: white; background: rgba(255,255,255,0.1); border-radius: 5px; }

        /* Content Area */
        .main { margin-left: 260px; padding: 40px; width: 100%; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        .resource-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            border-left: 5px solid #fca311;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .resource-card h3 { margin-bottom: 10px; color: #14213d; }
        .btn-sm { padding: 8px 15px; background: #e5e5e5; text-decoration: none; color: #333; font-size: 0.8rem; border-radius: 3px; }

        @media (max-width: 900px) {
            .sidebar { width: 70px; }
            .sidebar h2, .menu-item span { display: none; }
            .main { margin-left: 70px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>BDU BiT</h2>
        <div class="menu-item"><span>🏠 Dashboard</span></div>
        <div class="menu-item"><span>📚 My Courses</span></div>
        <div class="menu-item"><span>⚙️ Settings</span></div>
        <br>
        <a href="index.html" style="color: #fca311; text-decoration: none; padding-left: 15px;">Logout</a>
    </div>

    <div class="main">
        <header>
            <h1>Student Dashboard</h1>
            <div style="background: white; padding: 10px; border-radius: 5px;">📍 Bahir Dar, Ethiopia</div>
        </header>

        <div class="grid">
            <div class="resource-card">
                <h3>Full Stack Web Dev</h3>
                <p>Curriculum 2026</p><br>
                <a href="#" class="btn-sm">View Folder</a>
            </div>
            <div class="resource-card">
                <h3>Python for AI</h3>
                <p>Advanced PDF</p><br>
                <a href="#" class="btn-sm">Download</a>
            </div>
            <div class="resource-card">
                <h3>System Security</h3>
                <p>Lab Manual</p><br>
                <a href="#" class="btn-sm">Access Lab</a>
            </div>
        </div>
    </div>
</body>
</html>
