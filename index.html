<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDU Smart Library | International Standard</title>
    <!-- Google Fonts ለዘመናዊ ጽሁፍ -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: #14213d;
            color: white;
            position: fixed;
            width: 100%;
            z-index: 1000;
        }

        .logo { font-weight: 600; font-size: 1.5rem; color: #fca311; }

        /* Hero Section */
        .hero {
            height: 100vh;
            background: linear-gradient(45deg, rgba(20, 33, 61, 0.9), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1300&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .hero-content h1 { font-size: 3.5rem; margin-bottom: 20px; line-height: 1.2; }
        .hero-content p { font-size: 1.1rem; margin-bottom: 30px; color: #e5e5e5; }

        .cta-btn {
            background: #fca311;
            color: #14213d;
            padding: 15px 40px;
            text-decoration: none;
            font-weight: 600;
            border-radius: 5px;
            transition: 0.3s ease;
            display: inline-block;
        }

        .cta-btn:hover { background: white; transform: translateY(-5px); }

        @media (max-width: 768px) {
            .hero-content h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">BiT-Library</div>
        <div>Support | About</div>
    </nav>
    
    <section class="hero">
        <div class="hero-content">
            <h1>The Future of Computing <br><span style="color: #fca311;">is at Bahir Dar</span></h1>
            <p>Access global resources, coding bootcamps, and academic archives <br>designed for the next generation of engineers.</p>
            <a href="login.html" class="cta-btn">GET STARTED NOW</a>
        </div>
    </section>
</body>
</html>
