<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BDU Smart Library</title>
    <style>
        body {
            background: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { color: #14213d; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }
        input:focus { border-color: #fca311; }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #14213d;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Welcome Back</h2>
        <p>Please enter your BDU student credentials.</p>

        <form id="loginForm">
            <!-- Username input ከ id ጋር -->
            <input type="text" id="username" placeholder="Username (haile)" required>
            
            <!-- Password input ከ id ጋር -->
            <input type="password" id="password" placeholder="Password (bdu123)" required>
            
            <!-- አዲሱ በተን -->
            <button type="button" onclick="checkLogin()" class="login-btn">
                SIGN IN
            </button>
        </form>
    </div>

    <!-- ይህ የቼክ ማድረጊያው ኮድ ነው -->
    <script>
        function checkLogin() {
            var user = document.getElementById("username").value;
            var pass = document.getElementById("password").value;

            if (user === "haile" && pass === "bdu123") {
                window.location.href = "dashboard.html";
            } else {
                alert("የተሳሳተ Username ወይም Password ተጠቅመዋል። እባክዎ እንደገና ይሞክሩ!");
            }
        }
    </script>
</body>
</html>
