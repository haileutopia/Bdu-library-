<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BDU Smart Library</title>
    <style>
        body {
            background: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { color: #14213d; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }
        input:focus { border-color: #fca311; }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #14213d;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Welcome Back</h2>
        <p>Please enter your BDU student credentials.</p>
        <form onsubmit="window.location.href='dashboard.html'; return false;">
            <input type="text" placeholder="Username or ID" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="login-btn">SIGN IN</button>
        </form>
    </div>
</body>
</html>
